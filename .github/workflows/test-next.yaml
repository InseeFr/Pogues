name: Pogues Test CI for Next

on:
  push:
    branches: ["main"]
    paths: ["next/**"]
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ["next/**"]

jobs:
  test:
    name: Test Next
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: "next/package.json"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: next/pnpm-lock.yaml
      - run: cd next && pnpm install && pnpm test:coverage
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: next/coverage

  sonarqube:
    name: SonarQube Next
    runs-on: ubuntu-latest
    needs: test
    # Fork PRs do not get Sonar secrets; skip instead of failing the required check.
    if: |
      github.repository == 'InseeFr/Pogues' &&
      (github.event_name == 'push' ||
       github.event.pull_request.head.repo.owner.login == github.event.pull_request.base.repo.owner.login)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: coverage
          path: next/coverage
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8
        with:
          projectBaseDir: next
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_NEXT }}
